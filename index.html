<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halleron Games</title>
  <meta name="description" content="Play custom multiplayer tabletop and web games from Halleron Games." />
  <style>
    :root {
      --bg: #12100e;
      --surface: #1d1a17;
      --surface-hover: #26221e;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f3ef;
      --muted: #a8a29e;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --gold: #fbbf24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top center, rgba(239, 68, 68, 0.14), transparent 45%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 20px 56px;
      flex: 1;
    }

    header {
      margin-bottom: 36px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      max-width: 60ch;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .card p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .play-btn:hover {
      background: var(--accent-hover);
    }

    .play-btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .play-btn.disabled {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      pointer-events: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="eyebrow">HalleronGames.com</div>
      <h1>Halleron Games</h1>
      <p class="subtitle">Pick a game below to launch and play with friends. Sign in with Google when prompted to save your name and join rooms.</p>
    </header>

    <section id="games-grid" class="grid" aria-label="Available Games"></section>
  </main>

  <footer>
    &copy; <span id="year"></span> Halleron Games
  </footer>

  <script>
    const GAMES = [
      {
        title: "Killer Ludo",
        tag: "Multiplayer · Live",
        description: "House-rules Ludo with Triple Threat sniping, blockers, CPU fill-ins, and quick speech bubbles.",
        url: "https://house-rules-ludo.ai.studio"
      },
      {
        title: "CRASH",
        tag: "CRASH - Multiplayer",
        description: "13 card brag game for up to 4 players",
        url: "https://crash-studio-1.ai.studio"
      },
      {
        title: "Monster Maze",
        tag: "Scary Maze Run",
        description: "Find the exit before T-Rex finds you!",
        url: "https://service-3d-monster-maze-remastered.ai.studio"
      },
      {
        title: "Irish Trumps",
        tag: "Rummy in reverse",
        description: "Guess how many tricks you will win before playing any cards.",
        url: "https://irish-trumps.ai.studio"
      },
      {
        title: "Kitchen Marbles",
        tag: "Marbles in the kitchen",
        description: "Play marbles in the kitchen, hit the Dud 3 times to win.",
        url: "https://verge-marbles.ai.studio"
      },
    ];

    document.getElementById("year").textContent = new Date().getFullYear();

    const grid = document.getElementById("games-grid");
    GAMES.forEach((game) => {
      const card = document.createElement("article");
      card.className = "card";

      const hasUrl = Boolean(game.url && game.url.trim());
      card.innerHTML = `
        <div>
          <span class="card-tag">${game.tag}</span>
          <h2>${game.title}</h2>
          <p>${game.description}</p>
        </div>
        <a
          class="play-btn${hasUrl ? "" : " disabled"}"
          href="${hasUrl ? game.url : "#"}"
          ${hasUrl ? 'rel="noopener noreferrer"' : 'aria-disabled="true"'}
        >
          ${hasUrl ? "Play Now" : "Coming Soon"}
        </a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
